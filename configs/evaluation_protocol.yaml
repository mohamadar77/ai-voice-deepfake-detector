# Evaluation protocol specification (issue #35).
# Frozen before any evaluation score is computed. All slice definitions,
# attack groupings, bootstrap parameters and conditions are predeclared;
# none are tuned to results.
#
# src/voice_detector/evaluation.py loads this and rejects any field that
# disagrees with code conventions (metrics.METRICS_VERSION,
# scoring.SCORE_DIRECTION, scoring.DECISION_RULE).

version: evaluation-v1
declared_on: "2026-10-15"

# --- Inherited conventions (validated against code) -------------------------
metrics_version: metrics-v1
score_direction: higher_more_spoof
decision_rule: "spoof if score >= threshold, compared in float64"

# --- Attack classification ---------------------------------------------------
# Domain knowledge from ASVspoof 2019 LA. Hardcoded groupings, not inferred.
attack_groups:
  development_known:
    description: "Known algorithms, unseen speakers (dev A01-A06)"
    partition: development
    attacks: [A01, A02, A03, A04, A05, A06]
    bonafide_pool: development_all

  evaluation_known_algorithm:
    description: "Known algorithms (reuse A04/A06), unseen speakers"
    partition: evaluation
    attacks: [A16, A19]
    bonafide_pool: evaluation_all
    note: "A16 reuses A04 (waveform concatenation); A19 reuses A06 (neural)"

  evaluation_unseen:
    description: "Unseen algorithms — headline unseen result"
    partition: evaluation
    attacks: [A07, A08, A09, A10, A11, A12, A13, A14, A15, A17, A18]
    bonafide_pool: evaluation_all
    note: "Never pool with A16/A19"

# --- Per-attack slices -------------------------------------------------------
per_attack_slices:
  bonafide_pool_rule: "all bona fide clips from the same partition"

# --- Duration bins -----------------------------------------------------------
duration_bins:
  - {bin_id: "lt_1s",     lower: 0,    upper: 1,    upper_inclusive: false}
  - {bin_id: "1s_to_2s",  lower: 1,    upper: 2,    upper_inclusive: false}
  - {bin_id: "2s_to_4s",  lower: 2,    upper: 4,    upper_inclusive: false}
  - {bin_id: "4s_to_10s", lower: 4,    upper: 10,   upper_inclusive: true}
  - {bin_id: "gt_10s",    lower: 10,   upper: null,  upper_inclusive: false}

# --- Sub-1s policy -----------------------------------------------------------
sub_1s_policy:
  include_in_headline: true
  report_separately: true

# --- Bootstrap ---------------------------------------------------------------
bootstrap:
  confidence_level: 0.95
  n_resamples: 10000
  seed: 20261015
  resampling_unit: speaker_id
  method: percentile
  note: "67 eval speakers, no source recording mapping available"

# --- Conditions (reference to robustness_spec.yaml) --------------------------
# silence_trim is the evaluation-only shortcut diagnostic (parameters under
# `silence_trim:` in robustness_spec.yaml). It is scored for every frozen
# candidate like any other condition but is not a robustness claim.
conditions: [clean, codec_opus_24k, noise_20db, noise_10db, silence_trim]

# --- Development parity gate -------------------------------------------------
# After the clean development condition, each candidate's scores are compared
# with the dev_full_metrics in its own run record. Scores are not bitwise
# reproducible across batch composition (about 1e-6), so a single boundary clip
# may flip at the frozen threshold. Evaluation scoring requires a passed parity.
dev_parity:
  roc_auc_abs_tolerance: 1.0e-5
  eer_abs_tolerance: 1.0e-4
  max_abs_confusion_delta_total: 2

# --- Candidates (populated at freeze time, not hand-edited) ------------------
candidates: []
