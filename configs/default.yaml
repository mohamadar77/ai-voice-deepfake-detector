project:
  name: ai-voice-deepfake-detector
  seed: 20261004

paths:
  data_root: "${VOICE_DETECTOR_DATA_DIR:-data}"
  artifacts_root: "${VOICE_DETECTOR_ARTIFACTS_DIR:-artifacts}"

audio:
  sample_rate_hz: 16000
  mono: true
  window_seconds: 4.0

# Shared preprocessing specification. The same decoder, windowing and feature
# settings are used for training, locked evaluation and serving. Bump
# preprocessing_version whenever any value here changes so bundles stay
# reproducible and comparable. This string must equal PREPROCESSING_VERSION in
# src/voice_detector/preprocessing.py; a mismatch is rejected at load time.
# mfcc-v2: pooled MFCC statistics are computed over real samples only (option D).
preprocessing:
  version: mfcc-v2
  mfcc:
    n_mfcc: 20
    n_fft: 400        # 25 ms analysis window at 16 kHz
    hop_length: 160   # 10 ms hop at 16 kHz
    fmin: 20.0
    fmax: 8000.0      # Nyquist at 16 kHz
    include_delta: true

evaluation:
  preserve_official_splits: true
  primary_dataset: asvspoof2019_la
  threshold_source: development_reserved
  aggregate_by: clip_id
  evaluation_locked: true
